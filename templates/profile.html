{% extends "base.html" %}
{% block title %}Profile — PaperTrail{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-4">Your Profile</h1>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" value="{{ user.department or '' }}">
          </div>
          <div class="mb-4">
            <label class="form-label">Bio</label>
            <textarea name="bio" class="form-control" rows="3">{{ user.bio or '' }}</textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
      </div>
    </div>

    <div class="card shadow-sm mt-3">
      <div class="card-body p-4">
        <h5 class="card-title">Account info</h5>
        <dl class="row mb-0">
          <dt class="col-sm-4">Role</dt>
          <dd class="col-sm-8"><span class="badge bg-{{ 'danger' if user.role == 'admin' else 'secondary' }}">{{ user.role }}</span></dd>
          <dt class="col-sm-4">Member since</dt>
          <dd class="col-sm-8 text-muted">{{ user.created_at[:10] }}</dd>
        </dl>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Log in — PaperTrail{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Log in to PaperTrail</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="remember" value="1" id="remember">
            <label class="form-check-label small" for="remember">Keep me signed in on this device</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <hr>
        <p class="text-center mb-0 small">
          Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
